<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>UPRISING</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background: #000;
    width: 100%; height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    position: relative;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* GBA-style bezel */
  #wrap::before {
    content: '';
    position: absolute;
    inset: -6px;
    border: 3px solid #1a2535;
    border-radius: 4px;
    pointer-events: none;
    z-index: 10;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
  }
  /* Mobile controls bar */
  #mobile-ui {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 160px;
    display: none;
    z-index: 20;
    background: rgba(0,0,0,0.55);
    border-top: 1px solid rgba(255,255,255,0.07);
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
  }
  /* D-pad zone: touch anywhere inside determines direction */
  #dpad-zone {
    width: 148px; height: 148px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.14);
    position: relative;
    touch-action: none;
    flex-shrink: 0;
  }
  .dp-arrow {
    position: absolute;
    color: rgba(255,255,255,0.42);
    font-size: 20px;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #dp-u { top:6px;    left:50%; transform:translateX(-50%); }
  #dp-d { bottom:6px; left:50%; transform:translateX(-50%); }
  #dp-l { left:6px;   top:50%;  transform:translateY(-50%); }
  #dp-r { right:6px;  top:50%;  transform:translateY(-50%); }
  #dp-c {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,0.07);
    pointer-events:none;
  }
  /* Action buttons */
  .action-btns {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    flex-shrink: 0;
  }
  .abtn {
    width: 66px; height: 66px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.22);
    color: rgba(255,255,255,0.55);
    font-size: 12px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    flex-direction: column;
    gap: 2px;
    letter-spacing: 0.5px;
  }
  #abtn-action { border-color: rgba(192,40,28,0.7); color: #dd6050; }
  #abtn-bomb   { border-color: rgba(220,160,30,0.7); color: #e8b840; }
  /* Tap-to-continue hint on menu screens */
  #tap-hint {
    display: none;
    position: fixed;
    bottom: 170px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.45);
    font: 11px monospace;
    pointer-events: none;
    z-index: 21;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
</div>
<div id="mobile-ui">
  <div id="dpad-zone">
    <div class="dp-arrow" id="dp-u">▲</div>
    <div class="dp-arrow" id="dp-d">▼</div>
    <div class="dp-arrow" id="dp-l">◀</div>
    <div class="dp-arrow" id="dp-r">▶</div>
    <div id="dp-c"></div>
  </div>
  <div class="action-btns">
    <div class="abtn" id="abtn-action">攻撃<br><span style="font-size:15px">Z</span></div>
    <div class="abtn" id="abtn-bomb">爆弾<br><span style="font-size:15px">X</span></div>
  </div>
</div>
<div id="tap-hint">▼ タップして続ける ▼</div>
<script src="game.js"></script>
</body>
</html>
